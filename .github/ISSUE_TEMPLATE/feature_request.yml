name: 功能建议
description: 提出新功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你想完成什么创作任务，现在卡在哪里。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法
      description: 你希望应用怎么帮你完成。
  - type: textarea
    id: alternatives
    attributes:
      label: 现在的替代办法
