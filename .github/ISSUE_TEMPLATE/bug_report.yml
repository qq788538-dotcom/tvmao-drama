name: Bug 反馈
description: 应用出现错误或行为不符合预期
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 你做了什么操作，看到了什么，期望看到什么。可以附截图。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 新建 AI 视频节点
        2. 接入一张图片
        3. 点生成后……
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 应用版本
      description: 「设置 → 配置」里可以看到
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 系统
      options:
        - macOS（Apple 芯片）
        - macOS（Intel）
        - Windows 11
        - Windows 10
    validations:
      required: true
  - type: textarea
    id: diag
    attributes:
      label: 环境诊断结果
      description: 「设置 → 环境诊断」运行检查后点「复制结果」粘贴到这里。请先确认不含 API Key 等敏感信息。
      render: text
